[build-system]
requires = ["setuptools==83.0.0", "wheel==0.46.3"]
build-backend = "setuptools.build_meta"

[project]
name = "markovo"
version = "0.1.1"
description = "Customer-only Markovo API, CLI, and MCP client."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.urls]
Homepage = "https://markovo.net"
Documentation = "https://markovo.net/docs"
Repository = "https://github.com/fisher-byte/markovo"
Issues = "https://github.com/fisher-byte/markovo/issues"

[project.scripts]
markovo = "pdf2md_core.customer_cli:main"
markovo-mcp = "pdf2md_core.customer_mcp:main"
pdf2md = "pdf2md_core.customer_cli:main"
pdf2md-mcp = "pdf2md_core.customer_mcp:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf2md_core"]
