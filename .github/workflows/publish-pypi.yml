name: Publish Markovo to PyPI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify public package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Build wheel
        run: |
          python -m pip install --disable-pip-version-check build==1.3.0
          PYTHONPATH=src python -m unittest discover -s tests -v
          python -m build --wheel

      - name: Verify clean installation and MCP tools
        run: |
          python -m venv /tmp/markovo-pypi-smoke
          /tmp/markovo-pypi-smoke/bin/pip install --no-deps dist/markovo-*.whl
          /tmp/markovo-pypi-smoke/bin/markovo --help
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' | /tmp/markovo-pypi-smoke/bin/markovo-mcp | grep 'markovo_convert'

      - name: Upload verified wheel
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: markovo-pypi-distribution
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish immutable version
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/markovo/
    permissions:
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: markovo-pypi-distribution
          path: dist/

      - name: Publish to PyPI with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
